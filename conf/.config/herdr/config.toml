onboarding = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[theme]
name = "gruvbox"
auto_switch = false

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
  ],
  [
    "branch",
    "git_status",
     # $git_* from plugin herdr-git-status
    "$git_clean",
    "$git_dirty",
    "$git_conflict",
  ],
]

[experimental]
kitty_graphics = true

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
