# Extra bind mounts, offered in the launcher's Mount Selection menu.
#
#   [+]tag:src:[dest]:[options]
#
#   +       pre-select this mount at launch; omit to leave it off until toggled
#   tag     groups the mount in the menu — a workspace name works well
#   src     host path; a leading `~/` is the host home
#   dest    container path; a leading `~/` is the container home
#           defaults to src with the host home rewritten to the container home
#   options docker volume options, e.g. `ro`
#
# A source that does not exist yet is created when the mount is selected, owned
# by the user running the launcher — otherwise the container runtime makes it
# first, as root. Listing an entry here puts nothing on disk; ticking it in the
# menu does. An existing path is mounted as it is: to have a root-owned source,
# create it that way beforehand.
#
# One source may appear more than once, to place a repo in several trees at
# once. Every view is the same files: one git checkout, one branch, one index.
# For views that need to sit on different branches, use `git worktree` instead.
#
# Mount reference copies `ro`. Keeping exactly one writable location per repo
# keeps "which copy do I edit?" from ever being a question.
#
# `xndv mount` applies these inside an already-running sys-mode container, so a
# mapping added here can be picked up without relaunching.

# # A repo developed in its provider-shaped path, referenced from a workspace
# +acme:~/src/github/acme/widget:~/src/workspace/acme/widget:ro
#
# # A shared notes directory, writable, off unless toggled on
# acme:~/notes/acme:~/src/workspace/acme/notes
